; CYD ESP32-3248S035C (ST7796 480x320 + GT911). Config do TFT_eSPI vai aqui, sem editar a biblioteca.
; Cores erradas? Veja a barra de teste no boot (deve ser R, G, B nessa ordem):
;   vermelho/azul trocados -> troque TFT_BGR por TFT_RGB
;   cores invertidas (fundo claro) -> descomente -DTFT_INVERSION_ON=1
[env:cyd35]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 460800
board_build.partitions = partitions.csv
lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    tamctec/TAMC_GT911@^1.0.2
build_flags =
    -DUSER_SETUP_LOADED=1
    -DST7796_DRIVER=1
    -DTFT_WIDTH=320
    -DTFT_HEIGHT=480
    -DTFT_MISO=12
    -DTFT_MOSI=13
    -DTFT_SCLK=14
    -DTFT_CS=15
    -DTFT_DC=2
    -DTFT_RST=-1
    -DTFT_BL=27
    -DTFT_BACKLIGHT_ON=HIGH
    -DUSE_HSPI_PORT=1
    -DSPI_FREQUENCY=40000000
    -DSPI_READ_FREQUENCY=16000000
    -DLOAD_GLCD=1
    -DTFT_RGB_ORDER=TFT_BGR
    ; -DTFT_INVERSION_ON=1
