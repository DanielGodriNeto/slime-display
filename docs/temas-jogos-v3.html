<main><h1>Temas v3: agora com imagens reais</h1>
<p class="s">Logos, olho Sheikah, L e capacete são imagens reais baixadas e recortadas (fundo removido por luminância). O capacete foi reduzido para pixel art por ferramenta. Nada desenhado por mim.</p><div id="app"></div></main>
