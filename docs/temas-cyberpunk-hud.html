<h1>Edgerunners: refiz do zero, sem usar as imagens</h1>
<p class="s">Agora é <b>interface cyberpunk de verdade</b> (HUD, medidores, glitch, neon), não foto colada. O Sandevistan virou um <b>efeito de tela</b>: a cada virada de minuto o relógio dispara e deixa rastro. Aqui o tempo passa 5× mais rápido.</p>
