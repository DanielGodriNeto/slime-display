<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Slime Display</title>
<style>
:root{--bg:#f4f4f2;--fg:#222;--card:#fff;--bd:#d6d6d0;--sel:#dbe8ff}
@media (prefers-color-scheme:dark){:root{--bg:#1c1c1e;--fg:#eee;--card:#2a2a2d;--bd:#444;--sel:#26385c}}
body{margin:0;padding:16px;background:var(--bg);color:var(--fg);font-family:system-ui,sans-serif}
.dev{width:480px;max-width:100%;margin:0 auto;background:#111;border-radius:14px;padding:10px;box-sizing:border-box}
.scr{height:320px;position:relative;overflow:hidden;display:none}
.top{display:flex;justify-content:space-between;padding:8px 12px;font-size:13px;letter-spacing:1px;height:32px;box-sizing:border-box}
.pv{padding:2px 14px;height:184px}
.tt{font-size:20px;font-weight:700;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.row{display:flex;gap:12px;align-items:center;height:66px}
.sl{flex:none}
.bounce{animation:b .5s steps(2) infinite}
@keyframes b{50%{transform:translateY(-6px)}}
.eq{display:flex;gap:3px;align-items:flex-end;height:56px;margin-top:4px}
.eq i{flex:1;display:block;min-height:4px;border-radius:4px 4px 0 0}
.bar,.bar div{height:10px;border-radius:6px}.bar{margin:8px 0 3px}
.btns{display:flex;gap:8px;padding:4px 14px 0}
.pb{flex:1;height:54px;border:0;border-radius:12px;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-family:monospace;font-weight:700}
.pb:active{transform:translateY(3px)}
.ctl{display:flex;gap:8px;justify-content:center;margin:14px 0 0}
#pxc{display:block;width:100%;image-rendering:pixelated}
.app{max-width:520px;margin:18px auto 0;border:1px solid var(--bd);border-radius:10px;overflow:hidden;background:var(--card)}
.app .bar2{display:flex;justify-content:space-between;padding:6px 12px;background:var(--bg);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;padding:10px 12px}
.grid button{aspect-ratio:1;background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:2px;cursor:pointer}
.grid button.on{border:2px solid #3b8bff;background:var(--sel)}
.grid img{width:100%;height:100%;object-fit:contain;image-rendering:pixelated;display:block}
.ft{padding:6px 12px 10px;font-size:12px;opacity:.75}
</style></head><body>
<div class="dev"><canvas id="pxc" width="480" height="320"></canvas><div class="scr" id="scr">
<div class="top"><span id="brand"></span><span style="font-size:22px">21:47</span></div>
<div class="pv">
<div class="row"><img class="sl" id="sl" alt="">
<div style="flex:1;min-width:0"><div class="tt" id="tt"></div><div id="ar" style="font-size:14px"></div></div></div>
<div class="eq" id="eq"></div>
<div class="bar" id="barbg"><div id="fill" style="transition:width .9s linear"></div></div>
<div style="display:flex;justify-content:space-between;font-size:13px"><span id="el"></span><span id="rem"></span></div>
</div>
<div class="btns"><button class="pb" id="bp">|&lt;</button><button class="pb" id="bm" style="flex:1.4"></button><button class="pb" id="bn">&gt;|</button><button class="pb" id="bv">VOL</button></div>
<div id="vol" style="padding:6px 14px 0;font-size:12px;letter-spacing:1px;text-align:right"></div>
</div>
<div class="ctl"><button id="stb"></button></div>
<div class="app"><div class="bar2"><span>Slime Display - app do Windows (simulação)</span><span>COM3 conectado</span></div>
<div class="grid" id="grid"></div><div class="ft" id="aft"></div></div>
